<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114年度第1梯次英雄榜 - Hero Certification</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="hero-header">
        <h1>114年度第1梯次英雄榜</h1>
    </header>

    <div class="score-table-container">
        <table class="score-table">
            <thead>
                <tr>
                    <th>社群名稱</th>
                    <th>科目1 分數</th>
                    <th>科目2 分數</th>
                    <th>獲證</th>
                    <th>職業</th>
                    <th>畢業科系</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Pengu</td>
                    <td>72.5</td>
                    <td>77.5</td>
                    <td><span class="status-badge">是</span></td>
                    <td>金融業PM</td>
                    <td>資管</td>
                </tr>
                <tr>
                    <td>Bruce Wayne</td>
                    <td>77.5</td>
                    <td>90</td>
                    <td><span class="status-badge">是</span></td>
                    <td>IT工程師</td>
                    <td>資工</td>
                </tr>
                <tr>
                    <td>Dave</td>
                    <td>80</td>
                    <td>77.5</td>
                    <td><span class="status-badge">是</span></td>
                    <td>ISMS資安輔導顧問</td>
                    <td>資管</td>
                </tr>
                <tr>
                    <td>Yoyogau</td>
                    <td>77.5</td>
                    <td>72.5</td>
                    <td><span class="status-badge">是</span></td>
                    <td>行政人員</td>
                    <td>機械</td>
                </tr>
            </tbody>
        </table>
    </div>

    <main class="portfolio-grid cols-2">
        <article class="cert-card" data-aos="fade-up">
            <div class="cert-image-wrapper">
                <!-- 預留證書空間：等收到圖片後填寫 src -->
                <img src="" alt="Pengu 同學證照" class="cert-image">
            </div>
            <div class="cert-content">
                <h2 class="cert-title"><span class="term-zh">Pengu</span></h2>
            </div>
        </article>

        <article class="cert-card" data-aos="fade-up" data-aos-delay="100">
            <div class="cert-image-wrapper">
                <!-- 預留證書空間：等收到圖片後填寫 src -->
                <img src="" alt="Bruce Wayne 同學證照" class="cert-image">
            </div>
            <div class="cert-content">
                <h2 class="cert-title"><span class="term-zh">Bruce Wayne</span></h2>
            </div>
        </article>

        <article class="cert-card" data-aos="fade-up" data-aos-delay="200">
            <div class="cert-image-wrapper">
                <!-- 預留證書空間：等收到圖片後填寫 src -->
                <img src="" alt="Dave 同學證照" class="cert-image">
            </div>
            <div class="cert-content">
                <h2 class="cert-title"><span class="term-zh">Dave</span></h2>
            </div>
        </article>

        <article class="cert-card" data-aos="fade-up" data-aos-delay="300">
            <div class="cert-image-wrapper">
                <!-- 預留證書空間：等收到圖片後填寫 src -->
                <img src="" alt="Yoyogau 同學證照" class="cert-image">
            </div>
            <div class="cert-content">
                <h2 class="cert-title"><span class="term-zh">Yoyogau</span></h2>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>

</html>
