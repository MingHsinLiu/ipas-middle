<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業證照與認證 - Hero Certification</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="hero-header">
        <h1>114年度第2梯次</h1>
    </header>

    <main class="portfolio-grid">
        <article class="cert-card" data-aos="fade-up">
            <div class="cert-image-wrapper">
                <img src="certification/20250823/chen.jpg" alt="陳同學證照" class="cert-image">
            </div>
            <div class="cert-content">
                <h2 class="cert-title"><span class="term-zh">chen</span></h2>
            </div>
        </article>

        <article class="cert-card" data-aos="fade-up" data-aos-delay="100">
            <div class="cert-image-wrapper">
                <img src="certification/20250823/海豚.jpg" alt="海豚同學證照" class="cert-image">
            </div>
            <div class="cert-content">
                <h2 class="cert-title"><span class="term-zh">海豚</span></h2>
            </div>
        </article>
    </main>

    <script src="script.js"></script>
</body>

</html>
